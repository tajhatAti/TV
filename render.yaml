# Render Blueprint (ঐচ্ছিক) — রিপো কানেক্ট করে "Blueprint" নির্বাচন করলেই হবে।
# গোপন মানগুলো (BOT_TOKEN, API_ID, API_HASH, WEBAPP_URL) ড্যাশবোর্ডে বসাতে হবে।
services:
  - type: web
    name: session-generator
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: DEMO
        value: "0"
